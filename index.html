<style>
/* Layout: sticky header (title, search, tabs) over one readable column of reply cards.
   Each category carries its own mild hue (--h); header tint, tab pill, card titles and copy buttons take it. */
:root{
  --h:250;
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1d2430; --muted:#626d7c; --line:#e1e5ea;
  --ok:#1d7a4c; --note:#fff6dc; --note-line:#ead596;
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root,.card,nav button{
  --c-strong:oklch(0.47 0.11 var(--h));
  --c-mid:oklch(0.66 0.11 var(--h));
  --c-soft:oklch(0.955 0.028 var(--h));
  --c-wash:oklch(0.982 0.012 var(--h));
  --c-line:oklch(0.89 0.04 var(--h));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12161c;--surface:#1a1f27;--fg:#e5e9ef;--muted:#9aa5b4;--line:#2a323d;--ok:#5cc28c;--note:#2a2616;--note-line:#4d4523;color-scheme:dark}
  :root:not([data-theme="light"]),:root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) nav button{
    --c-strong:oklch(0.8 0.1 var(--h));--c-mid:oklch(0.68 0.1 var(--h));--c-soft:oklch(0.29 0.045 var(--h));--c-wash:oklch(0.21 0.02 var(--h));--c-line:oklch(0.36 0.05 var(--h))}
}
:root[data-theme="dark"]{--bg:#12161c;--surface:#1a1f27;--fg:#e5e9ef;--muted:#9aa5b4;--line:#2a323d;--ok:#5cc28c;--note:#2a2616;--note-line:#4d4523;color-scheme:dark}
:root[data-theme="dark"],:root[data-theme="dark"] .card,:root[data-theme="dark"] nav button{
  --c-strong:oklch(0.8 0.1 var(--h));--c-mid:oklch(0.68 0.1 var(--h));--c-soft:oklch(0.29 0.045 var(--h));--c-wash:oklch(0.21 0.02 var(--h));--c-line:oklch(0.36 0.05 var(--h))}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--c-soft),var(--c-wash));border-bottom:1px solid var(--c-line);transition:background .25s}
.bar{max-width:900px;margin:0 auto;padding:14px 16px 0;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-size:18px;font-weight:700;margin:0;flex:1 1 auto;letter-spacing:-.01em;color:var(--fg)}
h1 span{color:var(--c-strong);font-weight:500;font-size:14px;margin-left:6px}
#search{flex:0 1 280px;min-width:0;width:100%;font:inherit;padding:7px 12px;border:1px solid var(--c-line);border-radius:8px;background:var(--surface);color:var(--fg)}
#search:focus{outline:2px solid var(--c-mid);outline-offset:1px}
nav{max-width:900px;margin:0 auto;padding:12px 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
nav button{flex:0 0 auto;display:flex;align-items:center;gap:7px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
nav button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c-mid);flex:none}
nav button:hover{color:var(--fg);background:var(--c-wash)}
nav button[aria-selected="true"]{color:var(--c-strong);background:var(--c-soft);border-color:var(--c-line)}
nav button:focus-visible{outline:2px solid var(--c-mid);outline-offset:1px}
nav .n{font-weight:500;font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
main{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:12px}
.meta{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.card>header{position:static;background:var(--c-wash);border-bottom:1px solid var(--c-line);padding:10px 16px}
.card h2{font-size:16px;font-weight:650;margin:0;text-wrap:balance;color:var(--c-strong)}
.card .cat{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:2px}
.body{padding:12px 16px 14px}
.reply{border-top:1px dashed var(--c-line);padding-top:10px;margin-top:12px}
.body>.reply:first-child,.body>.note+.reply{border-top:0;padding-top:0;margin-top:0}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.opt{font-size:12px;font-weight:600;color:var(--c-strong);text-transform:uppercase;letter-spacing:.05em}
.text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font:inherit}
.text a,.note a{color:var(--c-strong)}
.copy{margin-left:auto;font:inherit;font-size:13px;font-weight:600;color:var(--c-strong);background:var(--c-soft);border:1px solid var(--c-line);border-radius:6px;padding:4px 12px;cursor:pointer;transition:border-color .15s}
.copy:hover{border-color:var(--c-mid)}
.copy:focus-visible{outline:2px solid var(--c-mid);outline-offset:1px}
.copy.done{color:var(--ok)}
.note{background:var(--note);border:1px solid var(--note-line);border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.note b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.empty{color:var(--muted);text-align:center;padding:40px 0}
mark{background:var(--note);color:inherit;border-radius:2px}
@media (max-width:520px){#search{flex-basis:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const HUES=[250,165,70,305,25,205,135,355,150,280];
const DATA=[{"name": "LC", "items": [{"q": "College Name Change", "replies": ["Dear candidate,\n\nThe deadline for changing the college name in exam registration is over. You cannot change it anymore. As exam allocations and hall ticket generations have started, we cannot assist you on this at this moment. Sorry for the inconvenience and thank you for your understanding."]}, {"q": "Certificates not able to download", "replies": ["Dear mam,\n\nAs NPTEL is migrating from nptel.ac.in to beta.nptel.ac.in, the documents are migrating from old website to new website. Hence the documents are currently not available to download. The migration is in progress and the details will be updated in new website for download shortly mam. Currently, 2026 Jan-APr semester documents are only available for download."]}, {"q": "Institutional data change request", "replies": ["Dear Sir/Madam,\n\nPlease fill the following change request: https://beta.nptel.ac.in/lc/change-request/\n\nKindly upload an official letter issued by your college to make changes in your institutional data."]}, {"q": "Informed technical team", "replies": ["Dear Sir,\n\nWe have informed the technical team about this. The team is working on it. We will update you on this shortly."]}, {"q": "Hall ticket", "replies": ["Dear candidate,\n\nThe hall tickets for October exams are yet to be released. We will be mailing you once its ready. Kindly wait."]}, {"q": "Missed Assignments", "replies": ["Dear Learner,\n\nGreetings from NPTEL.\n\nWe understand your concern regarding the missed assignment and appreciate your willingness to complete and submit it.\n\nHowever, we regret to inform you that once the assignment deadline has passed, the submission window cannot be reopened or extended for individual learners. The assignment deadlines are fixed and apply uniformly to all learners enrolled in the course.\n\nWe sincerely regret that we are unable to accommodate your request in this regard and kindly request you to ensure that the upcoming assignments are submitted within the specified deadlines.\n\nThank you for your understanding and cooperation."]}, {"q": "Add to WhatsApp", "replies": ["I couldn't find your mobile number in our database. Kindly apply for a phone number change in beta portal (beta.nptel.ac.in) SPOC login. We will process that and then will mail you the link to join the Whatsapp group."]}, {"q": "Assignment not visible", "replies": ["Dear sir/madam,\n\nIf the candidate had registered for the exam last semester, did not attend the exam and directly registered for exam this semester without enroling for the course, then the assignments will not be available for submission this semester.\n\nIf two exams are registered for the same day with same registered email id, then the exams will be scheduled at two different sessions, one in the forenoon and other in the afternoon."]}, {"q": "No mentor", "replies": ["Dear sir,\n\nMentor selection is not possible at this stage. But not having a mentor does not impact a student's assignments, marks, exam, certificates or credit transfer. Mentoring is just an opportunity given to students in local chapters to have extra guidance on the topics in the courses. Kindly proceed with the learning."]}, {"q": "Change exam date", "replies": ["Dear Candidate,\n\nGreetings from NPTEL!\n\nPlease note that NPTEL exams are scheduled well in advance and the exam dates are made available on the website for all to plan and schedule accordingly.\n\nA letter to the Vice Chancellors of all universities / institutes including yours intimating the exam dates are also sent from IIT Madras.\n\nRegret to inform you that there is no change in the schedule of NPTEL examinations which are conducted throughout our country and abroad as well.\n\nThe exam date, session and exam centre mentioned in the hall ticket will be final.\n\nThank you for understanding"]}, {"q": "SPOC login detail missing/incorrect", "replies": ["Dear sir/mam,\n\nThank you for pointing this out. We have noted down your request. Will forward this to the concerned team and get it corrected shortly. Thank you for your understanding and cooperation."]}, {"q": "Edit Swayam profile", "replies": ["Dear candidate,\nYou can edit your profile in Swayam.\n1. Go to your Swayam portal.\n2. Log in to your profile.\n3. Go to the course for which you need to edit the details.\n4. Click on your profile icon.\n5. Select My Profile\n6. Click on the Edit Profile option\n7. Change or update the required fields\n8. Click Update Profile\n\nAttached a video for your reference:"]}, {"q": "Details not in nptel.ac.in", "replies": ["Dear sir/madam,\nNPTEL is migrating from old website nptel.ac.in to new website beta.nptel.ac.in. Because of that, we stopped updating the details on the old website. The updated details will be reflected in the new website only. Thank you for your understanding and cooperation."]}, {"q": "SPOC profile active", "replies": ["Dear sir/madam,\nYour profile is activated. Kindly log in to beta.nptel.ac.in with your SPOC email ID to access your dashboard. Attaching the screenshot for your reference:"]}, {"q": "SPOC image updated", "replies": ["Dear sir,\nYour SPOC image is updated. Attaching the screenshot for your reference:"]}, {"q": "New LC updated", "replies": ["Dear sir,\n\nYour new SPOC profile is activated. Kindly log in to beta.nptel.ac.in to access your dashboard and view the details. Attaching the screenshot for your reference:"]}, {"q": "Screen recording", "replies": ["Can you please share a screen recording of this issue. A recording of your screen from logging in till mentor selection part. Share including the URL bar. It will be easy for us to identify the issue better."]}, {"q": "Extension", "replies": ["Dear candidate,\nThe enrolment for the set 1 courses was closed yesterday. There will not be any extensions on the deadline as already one week extension was provided."]}, {"q": "Tech glitches", "replies": ["We understood your concern. We have informed the technical team. They are looking into it. Will resolve the issue shortly."]}, {"q": "New LC addition", "replies": ["Dear Sir/Madam,\n\nGreetings from NPTEL.\n\nThank you for your interest in becoming an NPTEL Local Chapter. We truly appreciate your willingness to collaborate with us.\n\nPlease note that the Local Chapter programme is established at the institutional level. If an institution offers multiple programmes or departments, a single Local Chapter is created for the entire institution rather than separately for each programme.\n\nTo initiate the registration process, kindly complete the registration form using the link below:\n\nRegistration Form: https://beta.nptel.ac.in/auth/login/?next=/lc/apply/\n\nIn addition, please submit the following supporting documents along with your application:\n\n1. Request Letter (in the prescribed format): https://bit.ly/3iYNYsO\n2. Photograph of the SPOC (Single Point of Contact)\n3. College/Institution Logo\n4. Credit Transfer Support Document (optional, if applicable)\n\nOnce we receive your application and the required documents, our team will review the submitted details. Upon successful verification, we will send you a confirmation email regarding your institution's Local Chapter registration.\n\nWe look forward to your institution joining the NPTEL Local Chapter community.", "Dear Sir/Madam,\n\nThank you for your interest in becoming a local chapter of NPTEL.\n\nLocal Chapter is for each college or institute. If the institute runs multiple programs, we do not have an LC for each.\n\nPlease fill this form: http://bit.ly/2mlgEix\n\nKindly note that you will need to submit the following supporting documents to establish your college as a local chapter:\n1. Request letter - https://bit.ly/3iYNYsO (letter format)\n2. SPOC Photo\n3. College Logo\n4. Credit transfer support document (not mandatory)\n\nWe will verify the details of your response and send a confirmation mail."]}, {"q": "SPOC changes", "replies": ["Dear sir/madam\n\nTo update the details of your Single Point of Contact (SPOC), kindly complete the following request form:\n\nSPOC Details Update Form: https://beta.nptel.ac.in/auth/login/?next=/lc/change-request/\n\nTo process your request, please ensure that the following supporting documents are submitted along with the form:\n\n• SPOC Change Request Letter: https://bit.ly/3j6y3c3 (Letter format)\n• Recent photograph of the new SPOC\n\nOnce we receive the completed form and the required documents, we will review your request and process the changes accordingly."]}, {"q": "Institute name change", "replies": ["Dear sir/Madam,\n\nTo update any details pertaining to your institution, kindly complete the following form:\n\nhttps://bit.ly/LCChanges\n\nPlease note that an official letter issued by your institution must be uploaded along with the form to support the requested changes. This document is required for us to process your request.\n\nOnce the form and the necessary supporting document have been submitted, our team will review the request and make the required updates.", "Dear Sir/Madam,\n\nPlease fill the following form to update any changes in the details of your institution: https://bit.ly/LCChanges\n\nKindly note that you will need to upload an official letter issued by your college to make any changes.", "Dear Sir/Madam,\n\nPlease fill the following form to update any changes in details of the college or SPOC: https://bit.ly/LCChanges\n\nKindly note that you will need to submit the following supporting documents for the below change requests:\n1. Change in SPOC\n- SPOC Change request letter : https://bit.ly/3j6y3c3 (Letter format)\n- New SPOC photo\n\n2. Change in Name of Institution\n- You need to upload an official letter issued by your college"]}, {"q": "Application received", "replies": ["Dear SPOC,\n\nWe have received your application. The team is working on it. The changes will be reflected shortly. Kindly wait. Thanks for your patience."]}, {"q": "LC inactive", "replies": ["Dear Sir/Madam,\n\nA Local Chapter is recognised as an Active Local Chapter (LC) if it meets both of the following criteria in a semester:\n\n• A minimum of 25 learners from the Local Chapter are present for the NPTEL exam.\n• A minimum of 13 learners from the Local Chapter successfully earn certification.\n\nBased on the participation and certification data for the January–April 2026 semester, your Local Chapter did not meet the required criteria to be recognised as an Active LC.\n\nHowever, if your Local Chapter satisfies the above criteria during the July–December 2026 semester, its status will be updated to Active once the results for the July–December 2026 semester are published.\n\nWe encourage you to motivate more learners to enrol in NPTEL courses, appear for the exams, and successfully complete them. We look forward to your Local Chapter regaining its Active status in the upcoming semester.", "Dear sir,\n\nCriteria for Active LC\nA Local Chapter will be recognized as an ‘Active LC’ if\n\nA minimum of 25 learners from the LC write the exam (i.e. ‘Present’), AND\nA minimum of 13 learners pass the exam (i.e. ‘Certified’)\nThere were not enough registrations for the last semester, Jan-Apr 2026 to meet the criteria. If the local chapter meets the criteria for being an active LC in the upcoming semester, Jul-Dec 2026, then the local chapter will be recognized as active after the results of July-Dec 2026 semester are published."]}, {"q": "APAAR ID issue", "replies": ["Dear candidate,\n\nThe message you are seeing is only a warning and does not prevent you from proceeding with the enrolment or registration process. This issue originates from the APAAR system, and unfortunately, NPTEL is unable to assist with resolving it.\n\nPlease be assured that this warning will not affect your enrolment, course registration, or the transfer of credits. You may safely continue and complete both the enrolment and registration processes.\n\nTo ensure a smooth credit transfer, kindly make sure that your Name, Date of Birth, Gender, and APAAR ID are entered correctly and consistently across both the enrolment and registration forms.\n\nPlease note that if there is a mismatch in the photograph displayed, it will not impact the credit transfer process.\n\nAlso, the enrollment has been extended till August 3, 2026. You can complete your enrollment and registration.", "The displayed message is just a warning and not a blocker to proceed. This is an issue from the APAAR side and NPTEL cannot assist on it. But this will not affect the enrollment or registration. Kindly proceed and complete the enrolment and registration."]}, {"q": "Department not showing", "replies": ["Dear Sir,\n\nThank you for your email.\n\nCurrently, the SWAYAM enrolment process does not collect department information from learners. As a result, this information is not available in our records; it is not merely a case of it not being displayed.\n\nWe have already requested the SWAYAM team to include the collection of department information during the enrolment process. However, this enhancement will take some time to be implemented.\n\nIn the meantime, we hope that the roll number will serve as a suitable identifier to help distinguish the learners.\n\nThank you for your understanding and patience."]}, {"q": "Delay in changes", "replies": ["Dear sir/madam,\n\nIt will normally take one day of delay to reflect the details in the beta portal. Due to ongoing website maintenance, the update may take some time to reflect. We kindly request your patience, and the information will be updated shortly.", "Dear sir/madam,\n\nWe regret to inform you that, due to ongoing website maintenance, the update may take some time to reflect.\nWe kindly request your patience, and the information will be updated shortly.", "We regret to inform you that, due to ongoing automation work, the new Local Chapter update may take some time to reflect.\n\nWe kindly request your patience. Once your request has been processed, we will send you a confirmation email. Thank you for your understanding.", "Dear Sir/Madam,\n\nWe sincerely apologize for the delay and completely understand how frustrating it can be to wait for the requested updates. We truly appreciate your patience and understanding during this time.\n\nAs NPTEL is currently in the process of migrating from the old website to the new beta.nptel.ac.in platform, some updates are taking longer than usual to reflect. Our technical team is actively working on the migration and processing all pending requests. While we understand the inconvenience caused, we are unfortunately unable to expedite the process from our end.\n\nPlease be assured that your application is under process, and the requested information will be updated as soon as the migration-related work is completed.\n\nWe kindly request you to bear with us a little longer. Thank you for your continued patience, cooperation, and support."]}]}, {"name": "Mentor", "items": [{"q": "Mentor add", "replies": ["Dear sir/madam,\n\nMentor selection must be done from the Swayam portal. Not from the NPTEL beta portal. Please understand that for a SPOC to add a faculty as a mentor to a course, the faculty must be enrolled for the corresponding course. Else, he/she will not be displayed for assigning as mentor.\nAlso, for a student to add a mentor for a specific course, SPOC must have added a mentor for that corresponding course. Else, mentors will not be visible for the candidates. Kindly refer to the mentor assignment help document given below:\n\nhttps://docs.google.com/document/d/e/2PACX-1vRCrOTr8N5x66a7qIvuH8b2YFo6XZnvyW_B-G__b8zdUYkjHUfsIhxrmfiOmYuPmaZaQBiTIeUQENo-/pub\n\nIn your SPOC login in beta.nptel.ac.in, you can see the following:\n1. In Student Roster - you can see the list of all students and faculty who have enrolled for courses under your local chapter.\n2. In Mentor Roster - you can see the list of faculty that you assigned as mentors and the count of mentees under each mentor.\n\nThe mentee list is not available in the SPOC login. To view the mentee list, you have to login to the respective mentor dashboard of the mentors."]}, {"q": "Mentor/mentee details", "replies": ["Dear sir,\n\nThe mentee list will be displayed only in the mentor login, that mentors do with their registered email id. In the SPOC login, if you go to the Mentor roster, you can find the list of mentors. That is the faculty assigned as mentors will be displayed with the count of students who have selected that particular mentor.\n\nIf you go to the Student Roster, the whole student list will be displayed. If you selected the Show Details option, you can see the mentor name that the student selected against their name."]}, {"q": "Mentor registration", "replies": ["Dear sir/madam,\n\nPlease note that it is not mandatory for a faculty mentor to register for the examination. However, enrolment in the corresponding course is mandatory.\n\nFor a SPOC to assign a faculty member as a mentor for a course, the faculty member must first be enrolled in that course. Only then will their name appear in the SPOC portal for mentor assignment.\n\nAdditionally, NPTEL recommends that a faculty mentor be assigned no more than 50–60 mentees per course and mentor not more than three courses simultaneously. These recommendations are intended to ensure that every learner receives adequate guidance and support throughout the course.", "Dear sir/madam,\n\nWe have forwarded the issue to the technical team. It will be resolved shortly."]}, {"q": "Mentor add/change/delete", "replies": ["Dear SPOC,\nPlease ask students to select mentors using laptops. It should be working. If the problem persists, please let us know.", "Dear candidate,\n\nPlease select mentors using laptops. It should be working. If the problem persists, please let us know."]}, {"q": "Mentor certificate download", "replies": ["Dear sir/mam,\n\nKindly download the certificate from this link:"], "note": "http://docs.google.com/spreadsheets/d/1CJG1VQQQH1KCNgRpIrBLnN_vvCR7jBbZpq_bd6inbRc/edit?gid=1648340954#gid=1648340954\nOpen the sheet and search for the mentor and share the link against their name."}, {"q": "Download mentor certificates", "replies": ["Dear sir/madam,\n\nYour mentor certificate for the Jan-Apr 2026 semester is available now. Kindly log in using the incognito window of the chrome browser.\n\nFollow the steps given below to download the certificate.\n\n• Click the link below: [paste certificate link]\n• View the certificate details\n• Right-click the image, click Save Image As and click Save to download the certificate."]}, {"q": "Mentor certificate calculation", "replies": ["Dear sir/madam,\n\nFor obtaining the mentor certificate, it is mandatory to enrol for the course but not mandatory to register for the courses.\n\nA mentor score is calculated based on the following formula:\nNumber of Mentees in (40 – 59) + 5 * Number of mentees (60 - 74) + 8 *Number of mentees (75-89) + 20 * Number of mentees (90+) + Number of mentees present for exam [Capped at 10] If the total points are more than 10, then you will be eligible for mentor certificate.\n\nKindly refer to the example below:\nSuppose your college has 250 students enrolled, registered and written the exam. You are mentoring 110 students for a particular course and all the 110 students attended the exam. Suppose 10 students scored 90+ marks in that course, 15 students scored between 75-89 marks, 20 scored between 60-74 marks, 15 scored between 40-59 marks and the rest of them failed in the subject.. Then,\nNumber of Mentees in (40 – 59) = 15\n5 * Number of mentees (60 - 74) =5*20 =100\n8 *Number of mentees (75-89) =8*15=120\n20 * Number of mentees (90+) =20*10=200\nNumber of mentees present for exam [Capped at 10] = 10\n[capped at 10 means....any count beyond 10, you still take only 10]\nTotal points = 15+100+120+200+10=445\nIf the total points are more than 10, then you will be eligible for mentor certificate."]}, {"q": "Ineligible mentor certificate", "replies": ["Dear sir/mam,\nYou are not eligible for certificates. Kindly refer to the following document for the mentor certificate criteria:\nhttps://nptel.ac.in/_app/immutable/assets/Mentorship%20Criteria.C8fVHyOW.pdf"]}]}, {"name": "Certificate", "items": [{"q": "Certificate criteria", "replies": ["The certification criteria for the courses are as follows:\n\nAverage Assignment Score = 25% of the average of the best 8 assignments out of the total 12 assignments in the course.\n\nExam Score = 75% of the proctored certification exam score (out of 100).\nFinal Score = Average Assignment Score + Exam Score.\nPlease note that assignments include all assessment types available for a given week, including quizzes, programming tasks, and essay submissions.\n\nA learner will be eligible for a certificate only if:\n\nAverage Assignment Score ≥ 10/25, and\nExam Score ≥ 30/75.\nEven if the Final Score is 40/100 or above, a certificate will not be awarded unless both of the above criteria are satisfied."]}, {"q": "Certificate eligibility", "replies": ["NPTEL certificate will be issued based on both the assignment score and the final exam score meeting the eligibility criterion.\n\nWe request you to please check the calculation logic and the eligibility criteria mentioned in the course page to get the e-certificate.\n\nAVERAGE ASSIGNMENT SCORE >=10/25\nEXAM SCORE >= 30/75\nFINAL SCORE >=40"]}, {"q": "FDP course selection and payment", "replies": ["Dear Faculty,\n\nAs you are aware, some of the courses for the Jan - April 2026, NPTEL Exams have been accepted as FDP courses. See here for the list of FDP courses - [FDP course list link]\n\nIn the exam registration form, there was a feature where faculty could apply & pay for an FDP certificate. For those who have already paid, the e-certificates are made available in your candidate login.\n\nWe realize that some of you may have missed paying the 100 rupees for the FDP certificate. Here is your chance to pay the fees for the FDP certificate now.\n\nPlease click on this link and log in using your exam-registered email ID - https://beta.nptel.ac.in\n\nSince this is a newly launched portal, please adhere to the steps below:\n\n• Use ‘Sign in with Google’ to log in or enter your registered email ID to get the OTP and login to the dashboard\n• Navigate to ‘My Courses’ from the dashboard.\n• Apply the filters: Semester – Jan–Apr, Year – 2026.\n• The list of January 2026 semester courses will appear. For eligible courses, the ‘Apply for FDP’ option will be visible.\n• Select the courses and complete the FDP payment process.\n\nNote:\n\n1. This applies only to those faculty who have passed the exam(s) based on NPTEL criteria but missed paying for FDP alone. This applies to Jan - Apr 2026, NPTEL Exams courses.\n\n2. While enrolling in the course/registering for the exam, faculty must have chosen ROLE as FACULTY (not employed).\n\n3. This FDP form will be open only till 26th June 2026 (Friday) - 5:00 PM.\n\n4. You may choose to apply & pay for single or multiple FDP e-certificates through this form.\n\nPS: If you have already applied, please ignore this email.\n\nPlease write to - support@nptel.iitm.ac.in for any queries.\n\n- NPTEL Team."]}]}, {"name": "New Semester", "items": [{"q": "Course poster for current semester", "replies": ["Dear SPOCs,\n\nThe soft copies of the NPTEL course posters for the current semester are available at the link given below.\n\nhttps://drive.google.com/drive/folders/1G5YjosBCbOKvBQV5whC4LaNkFx67xq3V?usp=drive_link\n\nWe encourage you to share them widely to promote NPTEL courses among the students and faculty members of your institution."]}, {"q": "Semester-wise data", "replies": ["Dear sir/madam,\n\nAs we are revamping our NPTEL website, please refer to the table below to access the course and candidate details in the SPOC dashboard based on the relevant semester:\n\n• Current semester (July–December 2026): https://beta.nptel.ac.in/\n• January–April 2026 semester and all previous semesters: https://nptel.ac.in/"]}, {"q": "University change", "replies": ["Dear sir/madam,\n\nWe have noted your request.\n\nAs the current semester has already commenced, it is not possible to update the university name at this stage. The requested change will be incorporated for the next semester.\n\nAfter the declaration of the results for the July–December 2026 semester, we will circulate a form for updating university names, AISHE codes, and institution addresses. You may submit your request through this form before the enrollment process for the next semester begins, and the changes will be reflected accordingly.\n\nThank you for your understanding and cooperation.", "Kindly share the AISHE code of your college and university."]}, {"q": "APAAR and credit transfer", "replies": ["For credit transfer i.e. taking NPTEL courses on credit basis at any university there is no mandatory requirement of APAAR ID, However, if student wants to transfer all obtained credits through University/ Swayam in general to ABC ( Academic Bank of Credits), then it is mandatory as is the case elsewhere in the country."]}, {"q": "Academic integration / credit transfer", "replies": ["Dear mam,\n\nThank you for your interest in the academic integration of SWAYAM–NPTEL courses. To get a detailed understanding of the credit transfer, kindly refer to the attached Basics of Credit Transfer document."]}, {"q": "Merge mails", "replies": ["Please note that there is no option to change the email ID on the swayam portal. All communication will be sent to the registered email address only.\n\nYou need to enroll for the course with an email ID and need to complete the course with the same email ID.\n\nCandidates should use the same email id throughout the course run; for enrolling course(s) and for registering for the exam(s).\n\nAssignments submitted using any other email id will not be taken into consideration towards final consolidated score & certification.\n\nThe responsibility of the email id being valid till the course run is over lies with the candidates.\n\nWe can only help you to connect both IDs which will enable you to access the candidate login of NPTEL and can access old NPTEL certificates with new ID.\n\nIf you don't have access to the old email ID now or you may lose access soon and have any NPTEL courses joined in Jul 2025 sem with old email ID, you can join the same courses again with new email ID before the enrolment closes.\n\nPlease fill the form below\nhttps://docs.google.com/forms/d/e/1FAIpQLSfRf9kbZbYZCJyUF5A7eDivWIC6t923RkbcuhTYDqivfvQ8Jg/viewform"]}, {"q": "Extension of enrolment", "replies": ["Dear sir/madam,\n\nThank you for reaching out to us.\n\nAs we cater to learners across the country, we are unable to extend the enrollment deadline for individual requests. We kindly request you to coordinate with the concerned students and complete their enrollment within the stipulated timeline.\n\nPlease note that students who enroll after the course commencement date will still have access to the course content from the initial weeks. However, they will not be able to submit assignments whose deadlines have already passed, which may affect their overall performance in the course. In view of this, we strongly recommend completing the enrollment process at the earliest, in accordance with the published schedule.\n\nIf students enrol only after returning to campus on August 1, 2026, they would have already missed two weeks of course content, assignments, and other learning activities. Any further delay would result in them missing an additional week's content, causing them to lose out on a significant portion of the course.\n\nPlease note that the certification criteria for these courses are as follows:\n\n• Average Assignment Score = 25% of the average of the best 8 assignments out of the total 12 assignments in the course.\n• Exam Score = 75% of the proctored certification exam score (out of 100).\n• Final Score = Average Assignment Score + Exam Score.\n\nPlease note that assignments include all assessment types available for a given week, including quizzes, programming tasks, and essay submissions.\n\nA learner will be eligible for a certificate only if:\n\n• Average Assignment Score ≥ 10/25, and\n• Exam Score ≥ 30/75.\n\nEven if the Final Score is 40/100 or above, a certificate will not be awarded unless both of the above criteria are satisfied.\n\nIn view of this, we recommend that students complete their enrollment before the commencement of the college semester so that they do not miss the course content and assignments."]}, {"q": "Exam date clash", "replies": ["Dear sir/madam,\nIf the students have registered for the examination with the same registered email id, then we will accordingly allocate at two different sessions so that they won't clash. You can proceed with the registration. Make sure that the students use the same mail id for registering both the courses."]}, {"q": "Extra course addition", "replies": ["Dear sir/madam,\n\nThe course list from NPTEL for the upcoming semester of July-Dec 2026 is available here: https://docs.google.com/spreadsheets/d/e/2PACX-1vT0VPb0_8Klf6b_vmnf2xeMF0eb79YX3rmIuZjuxxlkGA7Kadg_WLLatyIM1c9QQ1PZQPZvSjL3FKhB/pubhtml?urp=gmail_link\n\nNPTEL will not be adding courses based on individual requests. But you can login to http://swayam.gov.in/ and see the courses provided by other coordinators like AICTE, IGNOU, etc and enroll for the required courses if they are available."]}]}, {"name": "Swayam", "items": [{"q": "Swayam ID mismatch", "replies": ["In the Swayam Portal, we have your mail id: [email ID]. Kindly login with this mail id. If you wish to change your mail id and unify the NPTEL and Swayam portal mail ids, kindly fill the following form:\nhttps://bit.ly/LCChanges"]}, {"q": "In Swayam, not in NPTEL", "replies": ["Dear sir/madam,\nWe regret to inform you that, due to ongoing website maintenance, the update may take some time to reflect.\nWe kindly request your patience, and the information will be updated shortly. However this will not affect the enrolment or registration of students in Swayam portal. Your college name is available in the drop-down list. Attaching the screenshot for your reference:"]}, {"q": "Screenshot with change option", "replies": ["Dear sir/madam,\n\nPlease note that there is no option to edit the details shown in the screenshot. However, this will not have any impact on your examination.\n\nIf you wish to appear for the NPTEL exam, you may proceed with the exam registration and complete the payment accordingly."]}, {"q": "Result blocked due to SC/ST", "replies": ["Dear sir/madam,\n\nThe candidate's result has been blocked as the SC/ST caste certificate was not submitted during exam registration. Despite multiple reminders, we did not receive any response. As the submission form is now closed, we are unable to assist further in this matter."]}, {"q": "Exam result", "replies": ["Dear candidate,\nYou can download your Exam Result from the login which is available in the top right corner of the website https://nptel.ac.in."]}, {"q": "Regional language course exam", "replies": ["For all the courses in regional languages, the exam will be conducted in English only."]}, {"q": "July–Dec data unavailable", "replies": ["Dear SPOC,\n\nThe data for the current July-Dec 2026 is yet to be updated in the portal. Kindly wait. It will be updated shortly."]}, {"q": "Feedback on beta.nptel.ac.in", "replies": ["Dear mam,\nWe have noted your suggestion. Will convey the same to the development team. Thank you for the feedback."]}, {"q": "PPT", "replies": ["Dear sir/mam,\n\nKindly find the following link to access the requested PPT:\n\nhttps://docs.google.com/presentation/d/10Q904GsBwzbXDwU8-y5pBdIwzQu3O3Mw/edit?slide=id.p38#slide=id.p38"]}]}, {"name": "Exam Centre & SPOC", "items": [{"q": "Exam centre form", "replies": ["Dear SPOC,\n\nWe are writing to you as you have expressed interest in acting as our exam partner.\n\nTo evaluate the feasibility of using your institution as an examination center, we need to conduct testing of your systems. As a first step, we request you to make approximately 100 systems available for testing.\n\nSince the testing will be conducted remotely, we would also require the support of a system administrator/technical staff member for about 3–4 hours to assist with the process.\n\nPlease find attached the testing requirements document for your reference. While Option 1 is our preferred mode of testing, we are open to proceeding with any of the other available options as well.\n\nKindly review the requirements and confirm your testing date by filling out the form provided below.\n\nLink: https://forms.gle/e7G6jteP3Zqwzcet6\n\nWe look forward to receiving your confirmation at the earliest.", "Dear SPOC,\n\nAt NPTEL, we continuously work towards improving the exam experience for candidates. In this regard, we request your support.\nPlease go through the details carefully and fill the form(s) below only if your institution is able to provide the required information or support.\n\nExam Centre Readiness Form:\n\nIn some cities, exam-centre capacity becomes insufficient due to high candidate registrations or unforeseen centre withdrawals.\nInstitutions willing to support NPTEL exam centres may fill the form below after carefully assessing their readiness and available infrastructure.\n\nGoogle Form: https://forms.gle/rMRYbJsFKaQKV1kX7\n\nDeadline for submission of form: June 15, 2026 (Monday, 5:00 PM)\n\nFor queries: localchapter@nptel.iitm.ac.in"]}, {"q": "SPOC registration link", "replies": ["Dear SPOC,\n\nKindly register through this link:\nhttps://docs.google.com/forms/d/e/1FAIpQLSdX8mZ4AFM-vkJh7vdUcLQQOP4nQs2U6WJPrq_-1ABlr5XzSw/formResponse"]}]}, {"name": "Workshop & STAR", "items": [{"q": "TA", "replies": ["The team is currently processing the TA claims for both the SPOC Workshop and the STAR Event. The claims are being processed in batches, and your TA claim may be under review. If there is any query regarding your TA claim, you will receive a call from our team. Otherwise, your payment will be processed shortly. Kindly wait sir."]}, {"q": "Reimbursement", "replies": ["Dear STAR,", "Dear STAR,\n\nYou may travel by any mode of transport. But the maximum reimbursement possible is the regular 2nd class AC train fare from your exam city to the nearest railway station of the event venue.\n\nYou may travel by any mode of transport. But the maximum reimbursement possible is the 2nd class AC train fare from your exam city to the nearest railway station of the event venue. If you are travelling in your own vehicle, to claim reimbursement, the vehicle must be in your name and you must hold a valid driving license.", "Dear STAR,\nPlease find the TA reimbursement guidelines here:\nhttps://docs.google.com/document/d/1vzOaxD9GPgetE03AjmI4CrBFUX8z6cw0Kog-Ttn1T4M/edit?tab=t.0#heading=h.5e4vexnbnjc1"]}, {"q": "Time of reimbursement", "replies": ["Dear STAR,\n\nA TA reimbursement form will be circulated a few days after the STAR event. You can fill the form. If every data is correct and no further queries are there, then the amount will be reimbursed within 7-10 working days."]}, {"q": "WhatsApp groups", "replies": ["Dear STAR,\nThe Google form for STAR event participation confirmation is closed. We cannot assist you on that. You can still come and attend the event. No issue in that.\n\nKindly join the following WhatsApp group:\n\nGroup 1: https://chat.whatsapp.com/GDa5KJ9fPJU5fC0T3E1x6f\nGroup 2: https://chat.whatsapp.com/LaQLRVMiydMC0sLvrCYzoD", "Dear STAR,\nThe Google form for STAR event participation confirmation is closed. We cannot assist you on that. You can still come and attend the event. No issue in that. Hostels will be provided for a limited duration for refreshing up. Breakfast and lunch will be provided for all candidates outside of Chennai and its outskirts."]}, {"q": "Das Sir forward", "replies": ["Dear Das sir,\n\nKindly help with this mail. The candidate is attending the IIT Kharagpur workshop."]}]}, {"name": "Not NPTEL", "items": [{"q": "Course not from NPTEL", "replies": ["Dear sir/madam,\n\nThe above mentioned course is not from NPTEL. Kindly write to the respective national coordinator."]}, {"q": "Other coordinator courses", "replies": ["Dear candidate,\n\nThe above stated courses are not from NPTEL. NPTEL cannot assist you on this. Kindly write to the respective national coordinators."]}, {"q": "Not our course", "replies": ["Dear candidate,\n\nThis course is not provided by NPTEL. Please write to the concerned national coordinator.", "Dear candidate,\nWe request you to kindly contact the support team of the respective National coordinator who is offering the said course.\n\nAs understood from your mail, the course you mentioned is not handled/offered by NPTEL. Could you please check the same?\n\nYou may please write to support@swayam.gov.in or to any ID which was shared to you when you joined that course.\n\nSince your mail has reached NPTEL, kindly let us know if we can be of any help regarding information related to any of the courses offered by NPTEL."]}]}, {"name": "WhatsApp Replies", "items": [{"q": "Data for current semester not available", "replies": ["The data for the current July-Dec 2026 is yet to be updated in the portal. Kindly wait. It will be updated shortly."]}, {"q": "SPOC login issue", "replies": ["Kindly try in incognito mode by Continue with Google option"]}]}, {"name": "Sheets Tips", "items": [{"q": "Find duplicates", "replies": ["To find duplicates in Google Sheets, use the =COUNTIF(A:A, A1)>1 formula. This counts how many times a cell's value appears in the column and flags it if it appears more than once."]}, {"q": "Remove duplicates", "replies": ["To remove rows with duplicate values in Google Sheets, select your data range, click Data in the top menu, hover over Data cleanup, and select Remove duplicates."]}, {"q": "XLOOKUP", "replies": ["=xlookup(E3,'Overall Reg'!E:E,'Overall Reg'!C:C,\"\")\n=XLOOKUP(A1,’Refsheet’!A:A,’Refsheet’!C:C,””)\n\nThe reference column (LCID) should be selected first and then the column whose value is needed."]}]}];
const tabs=document.getElementById('tabs'),list=document.getElementById('list'),search=document.getElementById('search');
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
let current=0;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(t,q){
  let h=esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  if(q){const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![^<]*>)','gi');h=h.replace(re,'<mark>$1</mark>');}
  return h;
}
DATA.forEach((c,i)=>{
  const b=document.createElement('button');
  b.role='tab';b.style.setProperty('--h',HUES[i]);b.id='tab-'+slug(c.name);
  b.innerHTML=esc(c.name)+'<span class="n">'+c.items.length+'</span>';
  b.onclick=()=>{search.value='';select(i)};
  tabs.appendChild(b);
});
function card(it,cat,q,hue){
  const el=document.createElement('article');el.className='card';if(hue!=null)el.style.setProperty('--h',hue);
  let h='<header>'+(cat?'<div class="cat">'+esc(cat)+'</div>':'')+'<h2>'+fmt(it.q,q)+'</h2></header><div class="body">';
  if(it.note)h+='<div class="note"><b>Internal note</b>'+fmt(it.note,q)+'</div>';
  it.replies.forEach((r,k)=>{
    h+='<div class="reply"><div class="rhead">'+(it.replies.length>1?'<span class="opt">Option '+(k+1)+'</span>':'')+
       '<button class="copy" type="button">Copy</button></div><p class="text">'+fmt(r,q)+'</p></div>';
  });
  el.innerHTML=h+'</div>';
  el.querySelectorAll('.copy').forEach((btn,k)=>btn.onclick=()=>copy(btn,it.replies[k]));
  return el;
}
function copy(btn,text){
  const ok=()=>{btn.textContent='Copied';btn.classList.add('done');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('done')},1500)};
  const fallback=()=>{const p=btn.closest('.reply').querySelector('.text');const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);
    try{document.execCommand('copy')?ok():(btn.textContent='Press Ctrl+C')}catch(e){btn.textContent='Press Ctrl+C'}};
  try{navigator.clipboard.writeText(text).then(ok,fallback)}catch(e){fallback()}
}
function select(i){
  current=i;document.documentElement.style.setProperty('--h',HUES[i]);
  [...tabs.children].forEach((b,k)=>b.setAttribute('aria-selected',k===i&&!search.value.trim()));
  const c=DATA[i];list.innerHTML='';
  const m=document.createElement('div');m.className='meta';m.textContent=c.items.length+' queries';list.appendChild(m);
  c.items.forEach(it=>list.appendChild(card(it)));
  try{history.replaceState(null,'','#'+slug(c.name))}catch(e){}
  try{localStorage.setItem('tab',i)}catch(e){}
}
search.addEventListener('input',()=>{
  const q=search.value.trim();
  if(!q){select(current);return}
  [...tabs.children].forEach(b=>b.setAttribute('aria-selected','false'));
  const ql=q.toLowerCase();list.innerHTML='';let n=0;
  DATA.forEach((c,ci)=>c.items.forEach(it=>{
    if((it.q+' '+it.replies.join(' ')+' '+(it.note||'')).toLowerCase().includes(ql)){list.appendChild(card(it,c.name,q,HUES[ci]));n++}
  }));
  const m=document.createElement('div');m.className=n?'meta':'empty';
  m.textContent=n?n+' matching queries across all tabs':'No replies match "'+q+'". Try a shorter word.';
  list.prepend(m);
});
let start=0;
const hash=location.hash.slice(1);
const hi=DATA.findIndex(c=>slug(c.name)===hash);
if(hi>=0)start=hi;else{try{const s=+localStorage.getItem('tab');if(s>=0&&s<DATA.length)start=s}catch(e){}}
select(start);
</script>
